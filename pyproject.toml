[project]
name = "vlm"
version = "0.1.0"
description = "Training and evaluation of vision-language models for report generation from 3D medical images."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE.md", "NOTICE.md"]
dependencies = [
    "accelerate==1.15.0",
    "deepspeed==0.19.7",
    "einops>=0.8.1",
    "faiss-cpu",
    "huggingface-hub>=1.31.0",
    "matplotlib>=3.10.6",
    "numpy>=1.26.4",
    "pandas>=2.2.3",
    "openpyxl>=3.1.0",
    "peft==0.21.2",
    "simpleitk>=2.5.2",
    "torch==2.14.1",
    "torchvision==0.29.1",
    "transformers==5.19.0",
    "wandb>=0.21.0",
    "loguru>=0.7.3",
    "pynrrd==1.1.3",
    "batchgenerators==0.25.1",
    "batchgeneratorsv2==0.3.0",
    "blosc2==3.11.0",
    "pycocoevalcap",
    "PyYAML>=6.0",
    "pydantic>=2.0,<3",
    "psutil>=5.9",
    "safetensors>=0.4",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "scikit-learn>=1.3",
    "tqdm>=4.66",
    "dynamic-network-architectures==0.4.4",
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

# CUDA 13.2.2 builds include NVIDIA's fix for silently incorrect results from the CUDA compiler.
[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["train", "inference", "inference_nifti", "eval"]

[tool.setuptools.packages.find]
include = ["vlm*"]

[project.optional-dependencies]

dev = [
  "pytest>=8.4.1",
  "pylint",
  "black",
  "isort",
  "pre-commit",
  "pytest-xdist>=3.8.0",
  "pytest-cov>=7.1.0",
]
# Triton kernels for the Qwen3.5 linear-attention layers. GPU environments only: once
# installed, transformers routes these layers through them on every device.
linear-attention = [
  "flash-linear-attention>=0.6.0",
]
# Masks of new volumes for 'inference_nifti.py', made as the training masks (TotalSegmentator
# v2 'total'). nnunetv2 2.6.4 is the newest release compatible with batchgeneratorsv2 0.3.0;
# numpy<2 keeps the locked numpy of the base environment, which the resolver would otherwise
# raise for vtk; vtk 9.7.2 has aarch64 wheels and needs numpy 2 only for its 'numpy' extra.
totalsegmentator = [
  "TotalSegmentator==2.18.0",
  "nnunetv2==2.6.4",
  "numpy<2",
  "vtk==9.7.2",
]

[tool.pytest.ini_options]
# 'uv run pytest vlm/test' skips the slow tests (multi-process, DeepSpeed, METEOR);
# 'uv run pytest -n auto -m "" vlm/test' runs them all, in parallel.
addopts = "-m 'not slow'"
markers = ["slow: multi-process, DeepSpeed or Java tests, skipped by default"]

[tool.isort]
profile = "black"

[tool.black]
line-length = 99
exclude = '''

(
  /(
      \.git
    | \.venv
    | _build
  )/
)
'''

[tool.pyright]
reportOptionalSubscript = "warning"
reportOptionalMemberAccess = "warning"
reportOptionalCall = "warning"
reportOptionalIterable = "warning"
reportOptionalContextManager = "warning"
reportOptionalOperand = "warning"
reportAssignmentType = "warning"
reportArgumentType = "warning"
reportGeneralTypeIssues = "warning"
reportCallIssue = "warning"
reportFunctionMemberAccess= "warning"
reportAttributeAccessIssue = "warning"
reportIncompatibleMethodOverride = "warning"
reportPrivateImportUsage = "warning"
reportIndexIssue = "warning"

[tool.pylint]
extension-pkg-allow-list = [
  "numpy",
  "torch",
]
