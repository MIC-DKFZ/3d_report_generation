[project]
name = "vlm"
version = "0.1.0"
description = "Training and evaluation of vision-language models for report generation from 3D medical images."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE.md", "NOTICE.md"]
dependencies = [
    "accelerate==1.9.0",
    "einops>=0.8.1",
    "faiss-cpu",
    "matplotlib>=3.10.6",
    "numpy>=1.26.4",
    "pandas>=2.2.3",
    "openpyxl>=3.1.0",
    "peft==0.10.0",
    "simpleitk>=2.5.2",
    "torch>=2.6.0,<2.7.0",
    "torchvision>=0.21.0,<0.22.0",
    "transformers==4.57.6",
    "trl==0.20.0",
    "wandb>=0.21.0",
    "loguru>=0.7.3",
    "pynrrd==1.1.3",
    "batchgenerators==0.25.1",
    "batchgeneratorsv2==0.3.0",
    "blosc2==3.11.0",
    "pycocoevalcap",
    "PyYAML>=6.0",
    "pydantic>=2.0,<3",
    "psutil>=5.9",
    "safetensors>=0.4",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "scikit-learn>=1.3",
    "tqdm>=4.66",
]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["train", "inference", "eval"]

[tool.setuptools.packages.find]
include = ["vlm*"]

[project.optional-dependencies]

dev = [
  "pytest>=8.4.1",
  "pylint",
  "black",
  "isort",
  "pre-commit",
]

[tool.isort]
profile = "black"

[tool.black]
line-length = 99
exclude = '''

(
  /(
      \.git
    | \.venv
    | _build
  )/
)
'''

[tool.pyright]
reportOptionalSubscript = "warning"
reportOptionalMemberAccess = "warning"
reportOptionalCall = "warning"
reportOptionalIterable = "warning"
reportOptionalContextManager = "warning"
reportOptionalOperand = "warning"
reportAssignmentType = "warning"
reportArgumentType = "warning"
reportGeneralTypeIssues = "warning"
reportCallIssue = "warning"
reportFunctionMemberAccess= "warning"
reportAttributeAccessIssue = "warning"
reportIncompatibleMethodOverride = "warning"
reportPrivateImportUsage = "warning"
reportIndexIssue = "warning"

[tool.pylint]
extension-pkg-allow-list = [
  "numpy",
  "torch",
]
